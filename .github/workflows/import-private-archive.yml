name: Import private campaign archive

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: one-time-private-archive-import
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.repository == 'Graybark/daring' &&
      github.event.repository.private == true &&
      github.event.issue.user.id == 24878945 &&
      github.event.issue.title == 'Import verified Doldrum archive (private handoff)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a private destination with Pages disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Graybark/daring --jq '.private == true and .has_pages == false')" = true
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import the verified archive through a temporary file handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import stat
          import subprocess
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          if Path('MIGRATION.md').exists():
              raise SystemExit('An archive was already imported; refusing to overwrite it.')
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          manifest = json.loads(event['issue']['body'])
          url = manifest['download_url']
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != 'https' or not (parsed.hostname or '').endswith('.oaiusercontent.com'):
              raise SystemExit('Unsupported file handoff host.')
          print('::add-mask::' + url, flush=True)
          try:
              with urllib.request.urlopen(url, timeout=120) as response:
                  payload = response.read(16 * 1024 * 1024 + 1)
          except Exception:
              raise SystemExit('The temporary file handoff could not be downloaded. No files imported.') from None
          expected = '2f5dfd8f6d457accedd3437db39364b159dfbcfb9319035245e47ae389724fb6'
          if len(payload) > 16 * 1024 * 1024 or hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit('Archive checksum mismatch; no files imported.')

          # Consume the short-lived file URL without putting it in Git history or logs.
          issue_endpoint = f"repos/Graybark/daring/issues/{event['issue']['number']}"
          subprocess.run(['gh', 'api', issue_endpoint, '--method', 'PATCH', '--input', '-'],
              input=json.dumps({'body': 'Verified private archive handoff downloaded and consumed. The temporary file URL has been removed. Publication remains disabled.'}),
              text=True, check=True, stdout=subprocess.DEVNULL)

          modules = {
              'Codex/build_session_browser.py', 'Codex/build_lore_data.py',
              'Codex/campaign_reference.py', 'Codex/requirements-session-browser.txt',
              'Codex/test_session_browser.py',
          }
          single_files = {'Dungeons & Dragons.pdf', 'sessions/gm/session-133.md'}
          session_extras = {'README.md', '_template.md', 'favicon.svg', 'index.html'}
          selected = {}
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Archive CRC validation failed.')
              for info in archive.infolist():
                  name = info.filename
                  parts = PurePosixPath(name)
                  if parts.is_absolute() or '..' in parts.parts or '\\' in name or stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit('Unsafe archive entry.')
                  if info.is_dir():
                      continue
                  is_session = name.startswith('Daring Dozen/Sessions/') and len(parts.parts) == 3 and (
                      parts.name in session_extras or re.fullmatch(r'DaringDozen\d{3}(?:_[0-9.]+)?\.md', parts.name)
                  )
                  if name in modules or name in single_files or is_session:
                      if name in selected or Path(name).exists():
                          raise SystemExit('Duplicate or pre-existing destination file: ' + name)
                      selected[name] = archive.read(info)
          if len(selected) != 144:
              raise SystemExit(f'Expected 144 archive and source files; found {len(selected)}.')
          page = selected['Daring Dozen/Sessions/index.html']
          blob_sha = hashlib.sha1(b'blob ' + str(len(page)).encode() + b'\0' + page).hexdigest()
          if blob_sha != '82b1bfe645665bbc60db201a5a4199dec2c16a96':
              raise SystemExit('The imported browser does not match the verified source.')
          for name, data in selected.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          Path('index.html').write_text('''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Daring Dozen</title></head>
          <body><p><a href="Daring%20Dozen/Sessions/index.html">Open the private campaign archive</a></p>
          <script>location.replace('Daring%20Dozen/Sessions/index.html' + location.search + location.hash);</script></body></html>
          ''', encoding='utf-8')
          Path('MIGRATION.md').write_text('''# Private archive migration

          Copied the verified Doldrum campaign-browser snapshot into Graybark/daring.
          Imported 144 archive/source files, including sessions 1-133, all six reference categories,
          the reference source PDF, five build/test modules, and the separate Session 133 GM notes.
          The original Doldrum files have not been deleted or redirected.
          Windows sync scripts and the historical import/migration scripts were deliberately not copied.

          Source: Graybark/Doldrum, private-session-archive workflow run 39071790046,
          artifact 12115755192, private-doldrum-session-archive.
          Archive SHA-256: 2f5dfd8f6d457accedd3437db39364b159dfbcfb9319035245e47ae389724fb6
          Verified source index Git blob: 82b1bfe645665bbc60db201a5a4199dec2c16a96

          ## Publication status

          No Pages deployment has been configured. The repository must remain private.
          GitHub Pages access-controlled private publication requires an organization using
          GitHub Enterprise Cloud. A personal private repository does not provide private Pages.
          No client-side password gate or noindex directive should be treated as access control.
          ''', encoding='utf-8')
          print(f'Imported {len(selected)} verified files; Pages remains disabled.')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and validate all archive entries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r Codex/requirements-session-browser.txt
          python Codex/build_session_browser.py
          python Codex/test_session_browser.py
      - name: Commit the private migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Graybark/daring --jq '.private == true and .has_pages == false')" = true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Daring Dozen/Sessions' 'Dungeons & Dragons.pdf' 'Codex' 'sessions/gm' index.html MIGRATION.md
          git commit -m 'Migrate the complete private Daring Dozen archive including Session 133'
          git push origin HEAD:refs/heads/main
      - name: Close the consumed migration handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo Graybark/daring --comment 'Migration completed and all five archive integrity tests passed. No campaign website was published.'
