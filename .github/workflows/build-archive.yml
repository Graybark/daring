name: Build private archive

on:
  push:
    branches: [main]
    paths:
      - 'Daring Dozen/Sessions/**'
      - 'Codex/**'
      - 'sessions/gm/**'
      - 'Dungeons & Dragons.pdf'
      - '.github/workflows/build-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-private-archive-main
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Graybark/daring' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify that the archive is private and not published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Graybark/daring --jq '.private == true and .has_pages == false')" = true
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned archive dependency
        run: python -m pip install --disable-pip-version-check -r Codex/requirements-session-browser.txt
      - name: Rebuild and check the archive
        run: |
          set -euo pipefail
          python Codex/build_session_browser.py
          python Codex/test_session_browser.py
      - name: Commit only the regenerated document
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Graybark/daring --jq '.private == true and .has_pages == false')" = true
          git add -- 'Daring Dozen/Sessions/index.html'
          if git diff --cached --quiet; then
            echo 'The private archive is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild the private Daring Dozen archive'
          git push origin HEAD:refs/heads/main
