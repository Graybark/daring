name: Build and publish archive

on:
  push:
    branches: [main]
    paths:
      - 'Daring Dozen/Sessions/**'
      - 'Codex/**'
      - 'Dungeons & Dragons.pdf'
      - '.github/workflows/build-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-private-archive-main
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Graybark/daring' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify the approved publication repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/Graybark/daring --jq '.id == 1424158821 and .has_pages == true')" = true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned archive dependency
        run: python -m pip install --disable-pip-version-check -r Codex/requirements-session-browser.txt
      - name: Rebuild, check and stage only the public browser
        run: |
          set -euo pipefail
          python Codex/build_session_browser.py
          python Codex/test_session_browser.py
          python Codex/build_pages.py
      - name: Commit only the regenerated offline document
        run: |
          set -euo pipefail
          git add -- 'Daring Dozen/Sessions/index.html'
          if git diff --cached --quiet; then
            echo 'The offline archive is already up to date.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Rebuild the Daring Dozen archive'
            git -c push.followTags=false push origin HEAD:refs/heads/main
          fi
      - name: Upload only the allowlisted website files
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: github.repository == 'Graybark/daring' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the public browser
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the live archive
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/published-browser.html
          grep -q 'id="session-data"' /tmp/published-browser.html
          grep -q 'noindex,nofollow,noarchive' /tmp/published-browser.html
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          page = Path('/tmp/published-browser.html').read_text(encoding='utf-8')
          match = re.search(r'<script id="session-data" type="application/json">(.*?)</script>', page, re.S)
          assert match, 'Missing embedded archive'
          archive = json.loads(match[1])
          numbers = [entry['number'] for entry in archive['sessions']]
          assert 133 in numbers, 'Session 133 is missing from the published archive'
          assert len(numbers) == len(set(numbers)), 'Duplicate sessions'
          print(f"Live archive verified: {len(numbers)} sessions and {len(archive['lore'])} reference entries.")
          PY
          printf 'Published browser: %s\nThe repository and website are public, as approved by the owner.\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
