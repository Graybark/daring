name: Publish Daring static website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-site.yml'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-daring-site-pipeline
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'Graybark/daring' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.changed.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify private-source credential is present
        env:
          DOLDRUM_READ_TOKEN: ${{ secrets.DOLDRUM_READ_TOKEN }}
        run: |
          test -n "$DOLDRUM_READ_TOKEN" || { echo "::error::Missing DOLDRUM_READ_TOKEN secret"; exit 1; }
      - name: Checkout ONLY approved static site from private Doldrum
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Graybark/Doldrum
          ref: main
          path: _private_build
          token: ${{ secrets.DOLDRUM_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public-site/
      - name: Verify and mirror five static files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          private = pathlib.Path('_private_build/public-site')
          required = {'index.html','nightwalker.html','far-realm-surges.html','favicon.svg','.nojekyll'}
          if not private.is_dir() or {p.name for p in private.iterdir()} != required:
              raise SystemExit('Approved static build is incomplete or has unexpected files')
          for name in required:
              p = private / name
              if not p.is_file() or p.is_symlink():
                  raise SystemExit('Unsafe source file: '+name)
          html = (private/'index.html').read_text(encoding='utf-8')
          m = re.search(r'<script id="session-data" type="application/json">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('Missing embedded session browser')
          data = json.loads(m[1])
          numbers = {s['number'] for s in data['sessions']}
          if not {133,134,135,136}.issubset(numbers):
              raise SystemExit('Incomplete campaign session archive')
          if 'id="source-link"' in html or 'github.com/Graybark/Doldrum' in html:
              raise SystemExit('Public site references private GitHub sources')
          if any('file' in s for s in data['sessions']) or any('source' in x for x in data['lore']):
              raise SystemExit('Embedded source paths were not removed')
          for name in required:
              dest = pathlib.Path(name)
              if dest.is_symlink():
                  raise SystemExit('Unsafe target path: '+name)
              dest.write_bytes((private/name).read_bytes())
          print('Verified and mirrored public static website,',len(numbers),'sessions')
          PY
      - name: Detect website changes
        id: changed
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- index.html nightwalker.html far-realm-surges.html favicon.svg .nojekyll)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No website changes; no deployment necessary"
          fi
      - name: Commit only generated site files
        if: steps.changed.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html nightwalker.html far-realm-surges.html favicon.svg .nojekyll
          git commit -m "Publish Daring site generated by private Doldrum"
          git -c push.followTags=false push origin HEAD:refs/heads/main
      - name: Stage public Pages artifact
        if: steps.changed.outputs.publish == 'true'
        run: |
          mkdir _site
          cp index.html nightwalker.html far-realm-surges.html favicon.svg .nojekyll _site/
      - name: Upload public Pages artifact
        if: steps.changed.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: mirror
    if: github.repository == 'Graybark/daring' && needs.mirror.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check live site
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$PAGE_URL" > /tmp/live-daring.html
          grep -q 'id="session-data"' /tmp/live-daring.html
          ! grep -q 'id="source-link"' /tmp/live-daring.html
